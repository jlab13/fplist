# CI on every push and pull request: formatting, an ASan build with the smoke test, and the
# packages (deb and rpm, amd64 and arm64) with an install test on the systems they are for.
# A tag v<version> also publishes a GitHub release with the packages, once all of that passed:
#
#   (raise project(fpl VERSION ...) in CMakeLists.txt, commit)
#   git tag v0.2.0 && git push origin v0.2.0
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

# a newer push to the same branch cancels the run still going; a release run is never cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  # the Maintainer (deb) / Vendor (rpm) of the packages: the GitHub noreply address of the author
  DEB_MAINTAINER: "JLab13 <1358048+JLab13@users.noreply.github.com>"

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # the version the sources are formatted with: another one may format differently
      - run: pipx install clang-format==23.1.3
      - run: clang-format --dry-run --Werror src/*.c src/*.h tools/*.c

  build:
    name: build + ASan smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # no notcurses here: the bundled one is built, as for the packages
      - name: dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake pkg-config gettext \
            libcurl4-openssl-dev libexpat1-dev libncurses-dev libunistring-dev zlib1g-dev
      - run: cmake -S . -B build -DFPL_ASAN=ON -DCMAKE_C_FLAGS=-Werror
      - run: cmake --build build -j"$(nproc)"
      - run: tools/ci/smoke.sh build

  package:
    name: ${{ matrix.format }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        format: [deb, rpm]
        arch: [amd64, arm64]
    # arm64 on an ARM runner: native, no QEMU
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    env:
      CONTAINER_ENGINE: docker
    steps:
      - uses: actions/checkout@v7
      # the same build as on a workstation: Debian 13 (deb) or AlmaLinux 10 (rpm) container
      - run: tools/pkg/build.sh ${{ matrix.format }} ${{ matrix.arch }}
      # deb: Debian 13, Ubuntu 24.04, 26.04; rpm: Fedora, AlmaLinux 10, openSUSE Leap 16, Tumbleweed
      - run: tools/pkg/install-test.sh ${{ matrix.format }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ matrix.format }}-${{ matrix.arch }}
          path: |
            dist/${{ matrix.arch }}/*.${{ matrix.format }}
            dist/${{ matrix.arch }}/*.ddeb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [format, build, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # the packages carry the version of CMakeLists.txt: the tag has to name the same one
      - name: tag matches project(VERSION)
        run: |
          version=$(sed -n 's/^project(fpl VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but CMakeLists.txt has project(fpl VERSION $version)"
            exit 1
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "Full Parameter List $GITHUB_REF_NAME" dist/*
